<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Post 2 · Rundgang Frame 1</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0a0a0a}
  img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
  .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 38%)}
  .brk{position:absolute;width:74px;height:74px;color:#fff}
  .brk.tl{top:64px;left:64px}
  .brk.br{bottom:64px;right:64px;transform:rotate(180deg)}
  .brk svg{width:100%;height:100%;display:block}
  .cap{position:absolute;left:64px;bottom:72px;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:.16em;text-transform:uppercase}
  .cap .n{color:rgba(255,255,255,.6);margin-right:18px}
</style>
</head>
<body>
  <img class="ph" src="../gallery/eingang-04a-0387.jpg" alt="">
  <div class="shade"></div>
  <div class="brk tl"><svg viewBox="0 0 117 117" fill="currentColor"><rect x="117" y="0" width="91" height="26" transform="rotate(180 117 13)"/><rect x="91" width="26" height="91"/></svg></div>
  <div class="brk br"><svg viewBox="0 0 117 117" fill="currentColor"><rect x="117" y="0" width="91" height="26" transform="rotate(180 117 13)"/><rect x="91" width="26" height="91"/></svg></div>
  <div class="cap"><span class="n">01</span>Der Eingang</div>
</body>
</html>
