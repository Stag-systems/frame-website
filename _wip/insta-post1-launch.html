<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Post 1 · Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Century Gothic';src:url('../fonts/century-gothic.woff2') format('woff2');font-weight:400}
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0a0a0a;--mut:#8a8a8a}
  body{width:1080px;height:1350px;background:#fff;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-weight:300;position:relative;padding:84px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:flex-start}
  .tag{font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
  .mid{margin:auto 0;padding-bottom:40px}
  .logo{width:640px;display:block;margin-bottom:88px}
  h1{font-family:'Century Gothic','Helvetica Neue',Arial,sans-serif;font-weight:400;font-size:64px;line-height:1.16;letter-spacing:.03em;text-transform:uppercase}
  .sub{font-family:'IBM Plex Mono',monospace;font-size:23px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:36px;line-height:1.9}
  .cta{position:absolute;left:84px;bottom:84px;background:var(--ink);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:22px 34px}
  .foot{position:absolute;right:84px;bottom:98px;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .brk{position:absolute;width:64px;height:64px;color:var(--ink)}
  .brk.bl{bottom:200px;right:84px;transform:rotate(180deg)}
  .brk svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
  <div class="top">
    <span class="tag">Est. 2026</span>
    <span class="tag">Vienna 1070</span>
  </div>
  <div class="mid">
    <img class="logo" src="FRAME_V2.svg" alt="FRAME">
    <h1>Creative Studio Space<br>für Foto, Video &amp; Content</h1>
    <div class="sub">220 m² Loftstudio · Vienna Photo District<br>Daylight · Blackout · Flexible Setups</div>
  </div>
  <div class="brk bl"><svg viewBox="0 0 117 117" fill="currentColor"><rect x="117" y="0" width="91" height="26" transform="rotate(180 117 13)"/><rect x="91" width="26" height="91"/></svg></div>
  <div class="cta">Ab jetzt buchbar</div>
  <div class="foot">theframe.at</div>
</body>
</html>
