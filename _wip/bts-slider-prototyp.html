<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAME · The Frame is yours — Slider-Prototyp</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<!--
  PROTOTYP, nicht eingebaut. Zwei Varianten fuer eine Behind-the-Scenes-Section.
  Bilder: WEBSITE/_wip/bts-src/ (8 Stueck, Auswahl aus HISU-PARK-BTS und dem
  Hingabe-Kurzfilm; bevorzugt die in der Kuratierung als unkritisch markierten).

  ⚠️ Nutzungsrechte sind NICHT geklaert - siehe
  2-PROJEKTE/INSTAGRAM-LAUNCH/kuratierung-hingabe-2026-08.md
-->
<style>
  /* Tokens 1:1 aus index.html */
  :root{--ink:#0a0a0a;--bg:#fff;--mut:#8a8a8a;--line:#e6e6e6;
        --gutter:clamp(18px,2.5vw,40px);--g12:repeat(12,minmax(0,1fr));
        --display:'Century Gothic','Helvetica Neue',Arial,sans-serif;
        --frame:clamp(20px,3.2vw,52px);
        --fs-micro:11px;--fs-label:12px;--fs-body:15px;--t-lead:16px;--t-body:17px;--t-data:14px}
  @media(min-width:821px){:root{--fs-micro:12px;--fs-label:13px;--fs-body:16px;--t-lead:17px;--t-body:18px;--t-data:15px}}
  @font-face{font-family:'Century Gothic';src:url('../fonts/century-gothic.woff2') format('woff2');font-weight:400}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-weight:300;
       font-size:var(--t-body);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
  .wrap{padding:0 var(--frame)}
  section{padding:clamp(56px,7vw,110px) 0}
  .sechead{display:grid;grid-template-columns:var(--g12);gap:var(--gutter);margin-bottom:clamp(22px,3vw,40px)}
  .sectitle{grid-column:1/span 6;font-family:var(--display);font-weight:400;font-size:34px;line-height:1.2;
            letter-spacing:.02em;text-transform:uppercase}
  .seclead{grid-column:7/-1;font-size:var(--t-lead);line-height:1.6;color:#444}
  @media(max-width:820px){.sectitle{grid-column:1/-1;font-size:28px}.seclead{grid-column:1/-1;margin-top:12px}}
  .kick{font-family:'IBM Plex Mono',monospace;font-size:var(--t-data);letter-spacing:.14em;
        text-transform:uppercase;color:var(--mut);margin-bottom:10px}
  .vlabel{font-family:'IBM Plex Mono',monospace;font-size:var(--fs-micro);letter-spacing:.2em;
          text-transform:uppercase;color:var(--mut);padding:0 var(--frame);margin-bottom:14px}
  hr.sep{border:0;border-top:1px solid var(--line);margin:0}

  /* ============ VARIANTE A · Filmstreifen ============
     Laeuft von selbst durch, kein Bedienelement. Zwei identische Spuren
     hintereinander, die zweite uebernimmt nahtlos - deshalb kein Sprung. */
  .strip{position:relative;overflow:hidden;padding:2px 0}
  .strip::before,.strip::after{content:'';position:absolute;top:0;bottom:0;width:clamp(40px,8vw,120px);z-index:2;pointer-events:none}
  .strip::before{left:0;background:linear-gradient(90deg,#fff,rgba(255,255,255,0))}
  .strip::after{right:0;background:linear-gradient(270deg,#fff,rgba(255,255,255,0))}
  .striprail{display:flex;width:max-content;animation:drift 90s linear infinite}
  .strip:hover .striprail,.strip:focus-within .striprail{animation-play-state:paused}
  .striprail figure{flex:none;margin-right:clamp(10px,1.4vw,22px)}
  .striprail img{display:block;height:clamp(220px,30vw,420px);width:auto;object-fit:cover}
  @keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
  @media(prefers-reduced-motion:reduce){
    .striprail{animation:none}
    .strip{overflow-x:auto;-webkit-overflow-scrolling:touch}
  }

  /* ============ VARIANTE B · Ueberblendung ============
     Ein Bildfeld, alle 5s weiter. Zaehler und Fortschrittslinie in Mono,
     sonst nichts - keine Pfeile, keine Punkte. */
  .fade{display:grid;grid-template-columns:var(--g12);gap:var(--gutter);align-items:end}
  .fadebox{grid-column:1/span 8;position:relative;aspect-ratio:3/2;overflow:hidden;background:#f4f4f4}
  .fadebox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
               opacity:0;transition:opacity 1.1s ease}
  .fadebox img.on{opacity:1}
  .fademeta{grid-column:9/-1;padding-bottom:2px}
  .fadecap{font-size:var(--fs-body);color:#444;line-height:1.55;min-height:3.2em}
  .fadecount{font-family:'IBM Plex Mono',monospace;font-size:var(--t-data);letter-spacing:.14em;
             color:var(--mut);margin-bottom:14px}
  .bar{height:1px;background:var(--line);position:relative;margin-top:18px}
  .bar i{position:absolute;left:0;top:0;height:1px;background:var(--ink);width:0}
  .bar i.run{transition:width 5s linear;width:100%}
  @media(max-width:820px){
    .fadebox{grid-column:1/-1;aspect-ratio:4/5}
    .fademeta{grid-column:1/-1;margin-top:16px}
    .fadecap{min-height:0}
  }
</style>
</head>
<body>

<section>
  <div class="wrap">
    <div class="sechead">
      <h2 class="sectitle">The Frame is yours</h2>
      <p class="seclead">Echte Produktionen im Studio: Aufbau, Licht, Styling und der Moment vor dem Take.</p>
    </div>
  </div>

  <div class="vlabel">Variante A · Filmstreifen, laeuft durchgehend</div>
  <div class="strip">
    <div class="striprail" id="rail"></div>
  </div>
</section>

<hr class="sep">

<section>
  <div class="vlabel">Variante B · Ueberblendung mit Zaehler</div>
  <div class="wrap">
    <div class="fade">
      <div class="fadebox" id="fadebox"></div>
      <div class="fademeta">
        <div class="fadecount"><span id="cnum">01</span> / <span id="ctot">08</span></div>
        <p class="fadecap" id="cap"></p>
        <div class="bar"><i id="bar"></i></div>
      </div>
    </div>
  </div>
</section>

<script>
  var SHOTS=[
    {f:'bts-01.jpg', c:'Hintergrund wird gerigged, kurz vor dem ersten Setup.'},
    {f:'bts-02.jpg', c:'Kostuem wird am Set gerichtet.'},
    {f:'bts-03.jpg', c:'Detail am Seamless, zwischen zwei Takes.'},
    {f:'bts-04.jpg', c:'Kamera-Rig an der Fensterfront.'},
    {f:'bts-05.jpg', c:'Label-Detail, HISU PARK FW26.'},
    {f:'bts-06.jpg', c:'Totale am Seamless, Leiter noch im Bild.'},
    {f:'bts-07.jpg', c:'Blick auf den Monitor waehrend des Takes.'},
    {f:'bts-08.jpg', c:'Letzte Korrektur, bevor die Kamera laeuft.'}
  ];
  var DIR='bts-src/';

  /* A: Spur zweimal ausgeben, damit der Umlauf nahtlos ist */
  (function(){
    var rail=document.getElementById('rail'), html='';
    for(var pass=0;pass<2;pass++)
      SHOTS.forEach(function(s){
        html+='<figure><img src="'+DIR+s.f+'" alt="'+s.c+'" loading="lazy"></figure>';
      });
    rail.innerHTML=html;
  })();

  /* B: Ueberblendung, alle 5s */
  (function(){
    var box=document.getElementById('fadebox'), cap=document.getElementById('cap'),
        num=document.getElementById('cnum'), bar=document.getElementById('bar'), i=0;
    document.getElementById('ctot').textContent=('0'+SHOTS.length).slice(-2);
    SHOTS.forEach(function(s,n){
      var img=new Image(); img.src=DIR+s.f; img.alt=s.c;
      if(n===0) img.className='on';
      box.appendChild(img);
    });
    var imgs=box.querySelectorAll('img');
    function show(n){
      imgs.forEach(function(x,k){x.classList.toggle('on',k===n);});
      cap.textContent=SHOTS[n].c;
      num.textContent=('0'+(n+1)).slice(-2);
      bar.classList.remove('run'); bar.style.width='0';
      void bar.offsetWidth;                 /* Reflow, sonst laeuft die Linie nicht neu an */
      bar.classList.add('run');
    }
    show(0);
    setInterval(function(){ i=(i+1)%SHOTS.length; show(i); },5000);
  })();
</script>
</body>
</html>
