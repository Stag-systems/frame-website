<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRAME — Grundriss (Demo, leer)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#141414;--mut:#8a8a8a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#fff;color:var(--ink);font-family:'IBM Plex Mono',monospace;padding:48px 32px;display:flex;flex-direction:column;align-items:center}
  .kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
  h2{font-weight:400;font-size:24px;letter-spacing:.02em;margin-bottom:4px}
  .cap{font-size:12px;letter-spacing:.06em;color:var(--mut);margin-bottom:30px}
  .planbox{width:100%;max-width:720px}
  svg.plan{width:100%;height:auto;display:block;overflow:visible}
  .poche{fill:var(--ink);stroke:none}
  .poche2{fill:var(--ink);stroke:none}
  .glass{stroke:var(--ink);stroke-width:1.1}
  .iwall{fill:none;stroke:var(--ink);stroke-width:15;stroke-linecap:butt;stroke-linejoin:miter}
  .col{fill:none;stroke:var(--ink);stroke-width:1.3}
  .street{font-size:15px;letter-spacing:.24em;text-transform:uppercase;fill:var(--mut)}
  .note{margin-top:26px;font-size:11px;letter-spacing:.05em;color:var(--mut);max-width:560px;text-align:center;line-height:1.7}
</style>
</head>
<body>

</html>
