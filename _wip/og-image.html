<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Century Gothic';src:url('../fonts/century-gothic.woff2') format('woff2')}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#fff;font-family:'Century Gothic',Arial,sans-serif;position:relative;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
  img.logo{width:520px}
  h1{font-size:52px;font-weight:400;text-transform:uppercase;letter-spacing:.03em;line-height:1.18;color:#0a0a0a}
  .sub{font-family:'Courier New',monospace;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8a;margin-top:20px}
  .brk{position:absolute;top:56px;right:64px;width:74px;height:74px}
  .foot{font-family:'Courier New',monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#0a0a0a}
</style></head>
<body>
  <img class="logo" src="FRAME_V2.svg">
  <div>
    <h1>Creative Studio Space<br>für Foto, Video &amp; Content</h1>
    <div class="sub">220 m² Loftstudio · Vienna Photo District · 1070 Wien</div>
  </div>
  <div class="foot">theframe.at</div>
  <svg class="brk" viewBox="0 0 117 117" fill="#0a0a0a"><rect width="91" height="26"/><rect x="26" width="91" height="26" transform="rotate(90 26 0)"/><rect x="117" y="117" width="91" height="26" transform="rotate(-180 117 117)"/><rect x="91" y="117" width="91" height="26" transform="rotate(-90 91 117)"/></svg>
</body></html>
